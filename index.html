try{const saved=Number(localStorage.getItem(BEST_KEY));if(Number.isFinite(saved)&&saved>=0&&saved<1e8)best=Math.floor(saved)}catch{}
const mult=()=>Math.min(5,1+(combo/5|0));
function musicProfile(){
 if(starTime>0)return {key:'power',bpm:184};
 if(elapsed>=40)return {key:'last',bpm:140};
 if(elapsed>=30)return {key:'hurry',bpm:116};
 return {key:'calm',bpm:92};
}
function music(){
 if(st!=='play'||mute||!AC||AC.state!=='running')return;
 const profile=musicProfile(),now=AC.currentTime;
 if(musicKey!==profile.key){stopVoices('bgm');musicKey=profile.key;musicNext=now+.015}
 if(musicNext<now-.2)musicNext=now+.01;
 const power=profile.key==='power',stepSeconds=60/profile.bpm/2;
 const horizon=Math.min(now+.12,now+Math.max(0,ROUND-elapsed),power?now+starTime:Infinity);
 while(musicNext<horizon){
  const step=power?powerStep:normalStep,melody=power?POWER_MELODY:NORMAL_MELODY;
  const note=melody[step%melody.length],delay=Math.max(0,musicNext-now),dur=Math.min(.22,stepSeconds*.75);
  // Put the normal tune in a clearer register for phone speakers.
  if(note)tone(hz(power?note:note+12),delay,dur,power?'square':'triangle',power?.020:.042,undefined,'bgm');
  if(step%4===0){const bass=[48,53,55,48][Math.floor(step/8)%4];tone(hz(bass+12),delay,Math.min(.24,stepSeconds*.85),'triangle',power?.014:.020,undefined,'bgm')}
  if(power&&step%2===0)tone(hz(note+12),delay,.07,'sine',.009,undefined,'bgm');
  if(power)powerStep++;else normalStep++;
  musicNext+=stepSeconds;
 }
}
function clearLabels(){for(const p of ps)p.el.remove();ps=[]}
function addLabel(text,x,y,kind='',duration=.65){
 const same=ps.filter(p=>Math.abs(p.x-x)<15&&p.l>.25).length;
 if(ps.length>=5)ps.shift().el.remove();
 const el=document.createElement('span');el.className='float'+(kind?' '+kind:'');el.textContent=text;$('fx').appendChild(el);
 const displayWidth=Math.max(1,C.getBoundingClientRect().width),labelWidth=el.getBoundingClientRect().width;
 const edge=Math.min(W/2,(labelWidth/2+4)/displayWidth*W);
 ps.push({x:Math.max(edge,Math.min(W-edge,x)),y:Math.max(10,y-same*5),l:duration,total:duration,el});
}
function paintLabels(){for(const p of ps){p.el.style.left=(100*p.x/W)+'%';p.el.style.top=(100*p.y/H)+'%';p.el.style.opacity=String(Math.min(1,p.l/.18))}}
function powerUp(){
 starTime=STAR_DURATION;hurtTime=0;flash=shake=0;starWarned=false;stopVoices('bgm');powerStep=0;
 SFX.star();showFeedback('無敵！',true,1.0);music();
}
const chBox=$('chs');
CH.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='ch';b.innerHTML='<canvas width="17" height="18"></canvas><span>'+c.n+'</span>';b.setAttribute('aria-label',c.n);b.onclick=()=>{cur=i;selUp()};chBox.appendChild(b);c.cv=b.firstChild;c.btn=b});
function selUp(){CH.forEach((c,i)=>{c.btn.classList.toggle('on',i===cur);c.btn.setAttribute('aria-pressed',String(i===cur));const x=c.cv.getContext('2d');x.clearRect(0,0,17,18);d(c.spr,0,0,x,c.palette)});draw()}
function hud(){
 const left=Math.max(0,Math.ceil(ROUND-elapsed));
 $('sc').innerHTML='<span class="num">'+score+'</span><small>点</small>';$('bs').innerHTML='<span class="num">'+best+'</span>';$('tm').innerHTML='<span class="num">'+left+'</span><small>秒</small>';
 $('tm').setAttribute('aria-label','残り'+left+'秒');$('tm').classList.toggle('low',left<=10);
 $('lf').textContent='♥'.repeat(Math.max(life,0))+'♡'.repeat(Math.max(MAX_LIFE-life,0));$('lf').setAttribute('aria-label','ライフ'+life+'、最大'+MAX_LIFE);
 updateTracked();
}
function showFeedback(message,gold=false,seconds=.65){feedbackText=message;feedbackGold=gold;feedbackUntil=elapsed+seconds;updateTracked()}
function updateTracked(){
 const stage=$('c'),r=stage.getBoundingClientRect(),w=Math.max(1,r.width),scale=w/W;
 const h=$('powerHud'),f=$('feedback');
 function place(el){const half=el.offsetWidth/2+5;const x=(px+8.5)*scale;el.style.left=Math.max(half,Math.min(w-half,x))+'px'}
 if(st==='play'&&starTime>0){h.hidden=false;$('powerText').innerHTML='★ <span class="num">'+Math.ceil(starTime)+'</span>秒';$('powerFill').style.width=(100*starTime/STAR_DURATION)+'%';place(h)}else h.hidden=true;
 if(st==='play'&&feedbackText&&elapsed<feedbackUntil){f.hidden=false;f.innerHTML=feedbackText.replace(/(\d+)/g,'<span class="num">$1</span>');f.classList.toggle('gold',feedbackGold);f.style.top=(starTime>0?'58%':'70%');place(f)}else f.hidden=true;
}
function drawStar(i){
 const x=i.x|0,y=i.y|0;
 const glow=reduced?.65:(1+Math.sin(elapsed*Math.PI*2*1.2))/2;
 X.save();
 // Keep the star solid; only its gold highlight and surrounding glints shimmer.
 X.globalAlpha=.14+glow*.12;X.fillStyle='#fff3a0';X.fillRect(x-2,y+1,15,8);X.fillRect(x+1,y-2,9,14);
 X.globalAlpha=1;d(S.star,x,y,X,{...P,y:glow>.5?'#fff1a0':'#ffd23f',Y:'#edaf24'});
 for(let n=0;n<3;n++){
  const angle=n*Math.PI*2/3+(reduced?0:elapsed*1.8),xx=Math.round(x+5+Math.cos(angle)*10),yy=Math.round(y+5+Math.sin(angle)*10);
  X.globalAlpha=.5+glow*.5;X.fillStyle=n%2?'#fff':'#ffe375';X.fillRect(xx-1,yy,3,1);X.fillRect(xx,yy-1,1,3);
 }
 X.restore();
}
function draw(){
 X.save();if(shake>0&&!reduced)X.translate((Math.random()*4-2)|0,(Math.random()*4-2)|0);X.drawImage(BG,0,0);
 X.fillStyle='rgba(255,255,255,.85)';cl.forEach(c=>{const x=c.x|0;X.fillRect(x,c.y+3,18,4);X.fillRect(x+3,c.y,11,7)});
 X.fillStyle='rgba(0,0,0,.2)';X.fillRect(px+2|0,GY,14,2);items.forEach(i=>{if(i.t==='star')drawStar(i);else d(S[i.t],i.x|0,i.y|0)});
 if(st==='play'&&starTime>0){X.globalAlpha=starTime<1?.3+.7*starTime:1;X.drawImage(CH[cur].outline,(px|0)-1,PY-1);X.globalAlpha=1}
 if(st==='play'&&hurtTime>0&&!reduced&&Math.floor(hurtTime*10)%2)X.globalAlpha=.4;
 d(CH[cur].spr,px|0,PY,X,CH[cur].palette);X.globalAlpha=1;
 if(st==='play'&&starTime>0){
  // The single countdown gauge is now displayed with the star label above the character.
  const count=starTime<=1?2:5;for(let i=0;i<count;i++){const angle=i*6.28/5+(reduced?0:elapsed*4),xx=Math.round(px+8+Math.cos(angle)*12),yy=Math.round(PY+7+Math.sin(angle)*12);X.fillStyle=i%2?'#fff6b0':'#ffd23f';X.fillRect(xx,yy,2,1);X.fillRect(xx,yy-1,1,3)}
 }
 // Deflected hazards leave collision handling immediately and become visual effects.
 for(const k of knocked){X.save();X.globalAlpha=Math.min(1,k.life/.16);X.translate(Math.round(k.x+5),Math.round(k.y+5));if(!reduced)X.rotate(k.angle);d(S[k.t],-5,-5);X.restore()}
 for(const p of sparks){X.globalAlpha=Math.min(1,p.life/.15);X.fillStyle=p.color;X.fillRect(Math.round(p.x),Math.round(p.y),2,1);X.fillRect(Math.round(p.x),Math.round(p.y)-1,1,3)}X.globalAlpha=1;
 if(flash>0&&!reduced){X.fillStyle='rgba(230,57,70,.25)';X.fillRect(0,0,W,H)}X.restore();paintLabels();
}
function hazardChance(){return .29+.11*Math.max(0,Math.min(1,(elapsed-35)/10))}
function spawn(){
 const danger=hazardChance(),food=.95-danger,r=Math.random();
 const t=r<food*49/66?'rice':r<food?'dango':r<food+.05?'heart':r<1-danger*12/29?'bad':'bomb';
 items.push({t,x:Math.random()*(W-11),y:-11,m:.8+Math.random()*.5});
}
function spawnScheduledStars(){
 while(starIndex<STAR_TIMES.length&&elapsed>=STAR_TIMES[starIndex]){
  items.push({t:'star',x:12+Math.random()*(W-35),y:-11,m:1});starIndex++;
 }
}
function deflect(i){
 let dir=i.x+5<px+8?-1:1;if(i.x<12)dir=1;else if(i.x>W-23)dir=-1;
 if(knocked.length>=8)knocked.shift();
 knocked.push({t:i.t,x:i.x,y:i.y,vx:dir*(32+Math.random()*14),vy:-(58+Math.random()*14),angle:0,spin:dir*(7+Math.random()*3),life:.55});
 for(let n=0;n<(reduced?3:7);n++)sparks.push({x:i.x+5,y:i.y+6,vx:(Math.random()-.5)*70,vy:-18-Math.random()*40,life:.28+Math.random()*.12,color:n%2?'#fff2a5':'#ffd23f'});
 if(sparks.length>42)sparks.splice(0,sparks.length-42);
 SFX.deflect();
}
function updateDeflections(dt){
 knocked=knocked.filter(k=>{k.life-=dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.vy+=110*dt;k.angle+=k.spin*dt;return k.life>0});
 sparks=sparks.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;return p.life>0});
}
function breakCombo(){combo=0}
function hit(i){
 const t=i.t;
 if(t==='bad'||t==='bomb'){
  if(starTime>0){score+=2;deflect(i);showFeedback('+2',true,.45);return;}
  if(hurtTime>0||life<=0)return;
  life=Math.max(0,life-1);breakCombo();hurtTime=1;flash=.18;if(t==='bomb')shake=.2;SFX[t]();showFeedback('♥ −1',false,.7);return;
 }
 if(t==='heart'){if(life<MAX_LIFE){life++;showFeedback('♥ +1',false,.65)}SFX.heart();return}
 combo++;maxC=Math.max(maxC,combo);const points=({rice:1,dango:2,star:5})[t]*mult();score+=points;
 if(t==='star')powerUp();else SFX[t](combo);
 if(combo%5===0){showFeedback(combo+'連続！×'+mult(),true,1.1);SFX.combo()}else if(t!=='star')showFeedback('+'+points,false,.48);
}
function releaseInput(){keys.l=keys.r=0;if(activePointer!==null){try{C.releasePointerCapture(activePointer)}catch{}activePointer=null}}
function start(){
 if(st==='play')return;cancelAnimationFrame(raf);stopVoices();au();releaseInput();clearLabels();
 score=0;life=3;combo=0;maxC=0;feedbackUntil=0;feedbackText="";items=[];sp=0;px=tx=51;flash=shake=0;elapsed=0;starTime=0;hurtTime=0;starWarned=false;starIndex=0;knocked=[];sparks=[];normalStep=0;powerStep=0;
 st='play';$('shareX').hidden=true;$('rules').hidden=true;$('ov').hidden=true;$('pause').hidden=false;hud();draw();last=performance.now();music();raf=requestAnimationFrame(loop);C.focus({preventScroll:true});
}
function finish(reason){
 if(st!=='play')return;st='over';feedbackText='';$('feedback').hidden=true;$('powerHud').hidden=true;$('rules').hidden=false;cancelAnimationFrame(raf);releaseInput();stopVoices();starTime=0;hurtTime=0;knocked=[];sparks=[];clearLabels();
 const newBest=score>best;if(newBest){best=score;try{localStorage.setItem(BEST_KEY,String(best))}catch{}}
 if(reason==='time')SFX.timeup();else SFX.over();hud();
 $('msg').innerHTML=(reason==='time'?'タイムアップ！':'ゲームオーバー')+'<strong class="result-score"><span class="num">'+score+'</span>点</strong>最大 <span class="num">'+maxC+'</span>連続'+(newBest?'<br><span class="record">ベスト更新！</span>':'');
 $('shareX').hidden=false;$('sub').textContent='キャラをえらんで、もう一回！';$('sub').hidden=false;$('chs').hidden=false;$('again').hidden=true;$('pause').hidden=true;$('go').textContent='もういちど';$('ov').hidden=false;draw();$('go').focus({preventScroll:true});
}
function pauseGame(){
 if(st!=='play')return;st='pause';$('feedback').hidden=true;$('powerHud').hidden=true;$('rules').hidden=false;cancelAnimationFrame(raf);releaseInput();stopVoices();$('pause').hidden=true;
 $('msg').innerHTML='ひとやすみ<br>残り '+Math.max(0,Math.ceil(ROUND-elapsed))+'秒';$('sub').textContent='残り時間と無敵時間は、そのままです。';$('sub').hidden=false;$('chs').hidden=true;$('again').hidden=false;$('go').textContent='つづける';$('ov').hidden=false;draw();
}
function resume(){if(st!=='pause')return;au();releaseInput();st='play';$('rules').hidden=true;$('ov').hidden=true;$('pause').hidden=false;last=performance.now();music();raf=requestAnimationFrame(loop);C.focus({preventScroll:true})}
function update(realDt){
 if(st!=='play')return;
 const step=Math.min(Math.max(realDt,0),ROUND-elapsed),dt=Math.min(.05,step);elapsed=Math.min(ROUND,elapsed+step);
 if(elapsed>=ROUND){finish('time');return}
 flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);hurtTime=Math.max(0,hurtTime-step);
 const before=starTime;starTime=Math.max(0,starTime-step);
 if(before>1&&starTime<=1&&!starWarned){starWarned=true;SFX.ending()}
 if(before>0&&starTime===0)stopVoices('bgm');
 cl.forEach(c=>{c.x+=c.v*dt;if(c.x>W)c.x=-20});
 ps=ps.filter(p=>{p.y-=reduced?0:12*dt;p.l-=dt;if(p.l<=0){p.el.remove();return false}return true});
 updateDeflections(dt);spawnScheduledStars();
 sp-=dt;if(sp<=0){spawn();sp=.95-.58*(elapsed/ROUND)}
 tx=Math.max(0,Math.min(W-17,tx+(keys.r-keys.l)*90*dt));px+=(tx-px)*Math.min(1,dt*20);
 const speed=34+50*(elapsed/ROUND),remaining=[];
 for(const i of items){const previous=i.y;i.y+=speed*i.m*dt;
  if(previous<PY+4&&i.y+11>=PY+1&&i.x+11>px+4&&i.x<px+13){hit(i);if(life<=0){finish('life');return}continue}
  if(i.y+10>GY){if(i.t==='rice'||i.t==='dango'||i.t==='star')breakCombo();continue}remaining.push(i);
 }
 items=remaining;music();hud();draw();
}
function loop(n){if(st!=='play')return;const dt=Math.max(0,(n-last)/1000);last=n;update(dt);if(st==='play')raf=requestAnimationFrame(loop)}
function aim(e){const r=C.getBoundingClientRect();tx=Math.max(0,Math.min(W-17,(e.clientX-r.left)/r.width*W-8.5))}
C.addEventListener('pointerdown',e=>{if(st!=='play'||e.isPrimary===false)return;e.preventDefault();activePointer=e.pointerId;try{C.setPointerCapture(e.pointerId)}catch{}aim(e)});
C.addEventListener('pointermove',e=>{if(st==='play'&&(e.pointerId===activePointer||(e.pointerType==='mouse'&&activePointer===null)))aim(e)});
for(const name of ['pointerup','pointercancel','lostpointercapture'])C.addEventListener(name,e=>{if(e.pointerId===activePointer)activePointer=null});
addEventListener('keydown',e=>{if(e.repeat&&(e.key===' '||e.key==='Enter'||e.key==='Escape'))return;if(st==='play'){if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;if(e.key==='ArrowRight'||e.key==='d')keys.r=1;if(e.key.startsWith('Arrow'))e.preventDefault();if(e.key==='Escape'){e.preventDefault();pauseGame()}}else if((e.key===' '||e.key==='Enter')&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();if(st==='pause')resume();else start()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;if(e.key==='ArrowRight'||e.key==='d')keys.r=0});addEventListener('blur',pauseGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
$('shareX').onclick=()=>{
 const msg='おにぎりキャッチで'+score+'点！ 🍙 あなたも挑戦してみて！';
 const configured='https://8bit-mini-games.github.io/onigiri-catch/';
 const url=configured.startsWith('https://')?configured:(location.hostname.endsWith('.github.io')?location.origin+location.pathname.replace(/(?:index\.html)?$/,''):'');
 if(!url){alert('X共有は公開サイトから利用できます。公開後にお試しください。');return;}
 const share='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg)+'&url='+encodeURIComponent(url);
 window.open(share,'_blank','noopener,noreferrer');
};
$('go').onclick=()=>st==='pause'?resume():start();$('again').onclick=start;$('pause').onclick=pauseGame;
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊';$('mu').setAttribute('aria-pressed',String(!mute));$('mu').setAttribute('aria-label',mute?'音楽・効果音をオンにする':'音楽・効果音をオフにする');stopVoices();if(!mute){au();music()}};
hud();selUp();
</script></body></html>
